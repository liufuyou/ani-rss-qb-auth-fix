name: Build & Push Docker Image

on:
  push:
    branches: [main]
    # 只改文档/License 时不触发构建（补丁文件与工作流改动仍会触发）
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
  schedule:
    # 每周一次：UTC 周日 19:17 = 北京时间每周一 03:17
    - cron: '17 19 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/liufuyou/ani-rss-qb-auth-fix

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Clone upstream
        run: git clone --depth 1 https://github.com/wushuo894/ani-rss.git /tmp/upstream

      - name: Get upstream commit
        id: upstream
        run: |
          cd /tmp/upstream
          SHA=$(git rev-parse --short=7 HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "上游最新 commit: $SHA"

      - name: Report upstream patch surface
        run: |
          echo "本镜像只覆盖下面两个文件，其余跟随上游："
          for p in \
            "ani-rss-application/src/main/java/ani/rss/download/qBittorrent.java" \
            "ani-rss-ui/src/view/config/DownloadView.vue" ; do
            echo ""
            echo "-- $p"
            if [ -f "/tmp/upstream/$p" ]; then
              echo "   存在 OK  上游 $(wc -l < "/tmp/upstream/$p") 行 / 补丁 $(wc -l < "$GITHUB_WORKSPACE/files/$(basename $p)") 行"
              curl -s "https://api.github.com/repos/wushuo894/ani-rss/commits?path=$p&per_page=1" \
                | jq -r '.[0] | "   上游最后修改：\(.commit.author.date)  \(.sha[0:7])  \(.commit.message | split("\n")[0])"' \
                || echo "   （上游历史查询失败，不影响构建）"
            else
              echo "   警告：上游已不存在该文件，补丁无处可覆盖"
            fi
          done

      - name: Apply override files
        run: |
          cp files/qBittorrent.java /tmp/upstream/ani-rss-application/src/main/java/ani/rss/download/qBittorrent.java
          cp files/DownloadView.vue /tmp/upstream/ani-rss-ui/src/view/config/DownloadView.vue

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build jar
        run: |
          cd /tmp/upstream
          mvn -B package -DskipTests -s "$GITHUB_WORKSPACE/settings.xml"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=raw,value=upstream-${{ steps.upstream.outputs.sha }}
            type=raw,value={{date 'YYYY-MM-DD'}}
          labels: |
            org.opencontainers.image.revision=${{ steps.upstream.outputs.sha }}
            org.opencontainers.image.description=ani-rss with qBittorrent username/password auth restored (patch-only build)

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: /tmp/upstream
          file: /tmp/upstream/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
